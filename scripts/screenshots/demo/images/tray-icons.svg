    <path d="M10 4 a11 11 0 0 1 -19 5" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <path d="M9 -13 v6 h-6" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
