<svg xmlns="http://www.w3.org/2000/svg" width="390" height="120" viewBox="0 0 390 120" font-family="Segoe UI, Arial, sans-serif">
  <rect x="2" y="2" width="386" height="116" rx="14" fill="#f8f9fb" stroke="#d3d9e0" stroke-width="2"/>
  <!-- Up to date -->
