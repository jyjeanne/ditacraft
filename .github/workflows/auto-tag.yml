name: Auto Tag Release

# Tags a new release automatically whenever a version bump to package.json
# lands on main, then explicitly dispatches release.yml at that tag, which
# builds, tests, packages, and publishes the GitHub Release with all
# artifacts attached.
#
# Note: pushing the tag with the default GITHUB_TOKEN does NOT by itself
# trigger release.yml's `on: push: tags: v*` -- GitHub deliberately excludes
# GITHUB_TOKEN-authored pushes from re-triggering other workflow runs (to
# avoid accidental infinite loops), with `workflow_dispatch` as one of the
# few exempted event types. So this workflow pushes the tag for the repo's
# git history, then dispatches release.yml itself via the API. A human
# pushing the same tag manually (with their own credentials) still triggers
# release.yml normally through its push trigger.

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'

permissions:
  contents: write
  actions: write

jobs:
  tag:
    name: Tag Release
    runs-on: ubuntu-latest
    # Skip commits the release workflow itself makes (e.g. the knowledge
    # graph refresh commit tags "[skip ci]") to avoid pointless re-checks.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Determine version and tag
      id: version
      run: |
        set -euo pipefail
        VERSION=$(node -p "require('./package.json').version")
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

    - name: Check whether tag already exists
      id: check
      run: |
        set -euo pipefail
        if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Create and push tag
      if: steps.check.outputs.exists == 'false'
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
        git push origin "${{ steps.version.outputs.tag }}"

    - name: Dispatch release workflow
      # The tag push above used GITHUB_TOKEN, so it will NOT trigger
      # release.yml's push-tags event (see note at the top of this file) --
      # explicitly dispatch it at the new tag instead. workflow_dispatch is
      # one of the few event types GITHUB_TOKEN is still allowed to trigger.
      if: steps.check.outputs.exists == 'false'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        gh workflow run release.yml --ref "${{ steps.version.outputs.tag }}" --repo "${{ github.repository }}"

    - name: Summary
      run: |
        if [ "${{ steps.check.outputs.exists }}" = "true" ]; then
          echo "Tag ${{ steps.version.outputs.tag }} already exists — nothing to do." >> "$GITHUB_STEP_SUMMARY"
        else
          echo "Pushed tag ${{ steps.version.outputs.tag }} and dispatched the release workflow to build and publish it." >> "$GITHUB_STEP_SUMMARY"
        fi
