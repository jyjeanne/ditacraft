name: Build and Test

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run security audit
      run: |
        # Without pipefail, `if npm audit | tee file; then` evaluates tee's
        # exit code (always 0), not npm audit's -- "release blocked" below
        # would never actually trigger regardless of what audit finds.
        set -o pipefail
        echo "## 🔒 Release Security Audit" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        # Scoped to production dependencies: devDependencies (e.g. the
        # @sentropic/graphify knowledge-graph tool) are never bundled into
        # the shipped .vsix/dist/*.js, so their transitive vulnerabilities
        # are a different risk category and shouldn't block a release.
        if npm audit --omit=dev --audit-level=high 2>&1 | tee audit-output.txt; then
          echo "✅ **No high or critical vulnerabilities found**" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Security vulnerabilities detected — release blocked**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat audit-output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit 1
        fi

  build-and-test:
    needs: security
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install server dependencies
      run: cd server && npm ci

    - name: Run linter
      run: npm run lint

    - name: Type-check (client + server)
      run: npm run check-types

    - name: Build with esbuild
      run: npm run esbuild-base -- --sourcemap

    - name: Run server tests with coverage
      run: cd server && npm run coverage

    - name: Check server coverage threshold
      run: cd server && npm run coverage:check

    - name: Compile client tests
      run: npm run compile-tests

    - name: Run client tests
      run: xvfb-run -a npm test

    - name: Package extension
      run: npm run package
      if: success()

    - name: Upload VSIX artifact
      uses: actions/upload-artifact@v7
      if: success()
      with:
        name: ditacraft-vsix
        path: '*.vsix'
        retention-days: 30

  publish-release:
    name: Publish GitHub Release
    needs: build-and-test
    runs-on: ubuntu-latest
    # Only for an actual tag push (not workflow_dispatch), so this job never
    # tries to create a release that isn't backed by a version tag.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install server dependencies
      run: cd server && npm ci

    - name: Resolve and verify release version
      id: version
      run: |
        set -euo pipefail
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        PKG_VERSION=$(node -p "require('./package.json').version")
        SERVER_PKG_VERSION=$(node -p "require('./server/package.json').version")
        if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
          echo "::error::Tag ${GITHUB_REF_NAME} (version ${TAG_VERSION}) does not match package.json version ${PKG_VERSION}. Bump package.json before tagging."
          exit 1
        fi
        if [ "$TAG_VERSION" != "$SERVER_PKG_VERSION" ]; then
          echo "::error::Tag ${GITHUB_REF_NAME} (version ${TAG_VERSION}) does not match server/package.json version ${SERVER_PKG_VERSION}. Bump server/package.json before tagging."
          exit 1
        fi
        echo "version=${TAG_VERSION}" >> "$GITHUB_OUTPUT"

    - name: Package VS Code extension (.vsix) and standalone bundles
      # `vsce package` runs the `vscode:prepublish` script first, which
      # (via esbuild.js) builds all four bundles in one pass: the client
      # extension, the LSP server, and the standalone dist/lsp-server.js +
      # dist/mcp-server.js bundles used below.
      run: npm run package

    - name: Assemble release assets
      run: |
        set -euo pipefail
        VERSION="${{ steps.version.outputs.version }}"
        mkdir -p release-assets

        # .vsix — already a zip-based package format, shipped as-is.
        mv "ditacraft-${VERSION}.vsix" release-assets/

        # PDF user guide — shipped as-is (not zipped).
        cp docs/user-guide/pdf/ditacraft-user-guide.pdf release-assets/

        # Standalone server bundles — zipped.
        zip -j "release-assets/lsp-server-${VERSION}.zip" dist/lsp-server.js
        zip -j "release-assets/mcp-server-${VERSION}.zip" dist/mcp-server.js

        ls -la release-assets/

    - name: Extract changelog section for this version
      run: |
        set -euo pipefail
        VERSION="${{ steps.version.outputs.version }}"
        awk -v ver="$VERSION" '
          /^## \[/ {
            if (found) exit
            if (index($0, "[" ver "]") > 0) { found=1; next }
            next
          }
          found { print }
        ' CHANGELOG.md > release-notes.md
        if [ ! -s release-notes.md ]; then
          echo "See CHANGELOG.md for details." > release-notes.md
        fi

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "${{ github.ref_name }}" \
          release-assets/*.vsix \
          release-assets/*.zip \
          release-assets/*.pdf \
          --repo "${{ github.repository }}" \
          --title "${{ github.ref_name }}" \
          --notes-file release-notes.md
