name: Knowledge Graph

# Regenerates the graphify knowledge graph in docs/graph whenever code
# changes land on main, and commits the refreshed artifacts back.

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'server/src/**'
      - 'mcp/**'
      - 'scripts/**'
      - 'esbuild*.js'
      - 'package.json'
      - '.graphifyignore'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: knowledge-graph-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate Knowledge Graph
    runs-on: ubuntu-latest
    # Skip runs triggered by this workflow's own auto-commit
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate knowledge graph
        run: npm run graph

      - name: Commit updated graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/graph
          if git diff --cached --quiet; then
            echo "Knowledge graph is already up to date."
          else
            git commit -m "chore(graph): refresh knowledge graph [skip ci]"
            git push
          fi
